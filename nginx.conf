server {
  listen 80;
  root /usr/share/nginx/html;

  # Change "backend:4000" to wherever the Express API runs.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }

  # Client-side routes (/login, /apps/3, /admin) all load index.html.
  location / {
    try_files $uri /index.html;
  }
}
