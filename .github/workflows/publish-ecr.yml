name: Build, scan, and publish frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build image
        env:
          LOCAL_IMAGE: deployhub-frontend:${{ github.sha }}
        run: docker build --pull --tag "$LOCAL_IMAGE" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deployhub-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Validate AWS region
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "::error::Set the AWS_REGION repository variable to your ECR region."
            exit 1
          fi

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Push scanned image to ECR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          LOCAL_IMAGE: deployhub-frontend:${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: 4th-yr-project-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "$LOCAL_IMAGE" "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:latest"
